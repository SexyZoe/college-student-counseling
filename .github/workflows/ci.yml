name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Run all automated tests
        run: npm test

      - name: Build backend image
        run: docker build -f server/Dockerfile -t shuzhi-backend:ci .

      - name: Start container
        run: |
          docker volume create shuzhi-ci-data
          docker run -d --name shuzhi-ci \
            -p 18787:8787 \
            -e AUTH_SECRET=ci-0123456789abcdef0123456789abcdef \
            -e SEED_DEMO_DATA=true \
            -v shuzhi-ci-data:/app/data \
            --init --read-only --tmpfs /tmp:size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            shuzhi-backend:ci

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18787/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Verify runtime security and core APIs
        run: |
          test "$(docker exec shuzhi-ci id -u)" != "0"
          test "$(docker inspect shuzhi-ci --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          docker exec shuzhi-ci npm run smoke

      - name: Verify data survives container replacement
        run: |
          docker exec \
            -e PROBE_MODE=write \
            -e PROBE_ID=ci-container-replacement-probe \
            shuzhi-ci npm run persistence:probe
          docker rm -f shuzhi-ci
          docker run -d --name shuzhi-ci \
            -p 18787:8787 \
            -e AUTH_SECRET=ci-0123456789abcdef0123456789abcdef \
            -e SEED_DEMO_DATA=true \
            -v shuzhi-ci-data:/app/data \
            --init --read-only --tmpfs /tmp:size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            shuzhi-backend:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18787/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec \
            -e PROBE_MODE=read \
            -e PROBE_ID=ci-container-replacement-probe \
            shuzhi-ci npm run persistence:probe

      - name: Show container logs on failure
        if: failure()
        run: docker logs shuzhi-ci || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f shuzhi-ci 2>/dev/null || true
          docker volume rm shuzhi-ci-data 2>/dev/null || true
