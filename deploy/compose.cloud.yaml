# Installed as compose.override.yaml on the campus instance.
# Set CLOUD_SUBNET to a subnet approved for your destination network.
services:
  backend:
    profiles: ["sqlite"]
  backend-mysql:
    ports: !override
      - "127.0.0.1:8787:8787"
    environment:
      TRUST_PROXY: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  mysql:
    ports: !reset []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  mysql-migrate:
    # Deployment applies migrations only; business assertions run separately.
    command: ["node", "scripts/mysql-migrate.js"]
  gateway:
    image: nginx:1.28-alpine
    profiles: ["mysql-runtime"]
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-mysql:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  default:
    ipam:
      config:
        - subnet: "${CLOUD_SUBNET:-192.168.240.0/24}"
