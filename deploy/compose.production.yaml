# Apply after compose.yaml and the campus compose.override.yaml.
# School-provided certificates must be valid for the campus hostname and MySQL host.
services:
  backend-mysql:
    environment:
      NODE_ENV: production
      SEED_DEMO_DATA: "false"
      CORS_ALLOWED_ORIGINS: "${CAMPUS_SITE_URL:?Set the campus HTTPS origin}"
      MYSQL_SSL_CA: /run/campus-db/ca.pem
    volumes:
      - "${MYSQL_CA_FILE:?Set the MySQL CA path}:/run/campus-db/ca.pem:ro"
  gateway:
    ports: !override
      - "${GATEWAY_BIND:-0.0.0.0}:80:80"
      - "${GATEWAY_BIND:-0.0.0.0}:443:443"
    volumes: !override
      - ./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - "${CAMPUS_CERT_DIRECTORY:?Set the certificate directory}:/etc/nginx/tls:ro"
