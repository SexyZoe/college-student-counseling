openapi: 3.1.0
info:
  title: 数智心港湾后端 API
  version: 2.0.0
  description: |
    当前入口为管理员和辅导员使用的学生心理关怀档案管理系统。
    Student 标签接口为旧版历史能力，正式启动已禁止学生登录。网页使用 HttpOnly Cookie（写请求需 X-Requested-With: campus-web），兼容脚本 Bearer 令牌鉴权。
servers:
  - url: http://127.0.0.1:8787
    description: 本地开发
tags:
  - name: Operations
  - name: Authentication
  - name: Student
  - name: Counselor
  - name: Admin
  - name: Registry
  - name: TalkRecords
paths:
  /api/v1/site:
    get:
      tags: [Operations]
      summary: 获取学校名称、求助和隐私联系信息
      security: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/student/catalog:
    get:
      tags: [Student]
      summary: 获取固定版本量表、FAQ及测评同意版本
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/student/submissions:
    post:
      tags: [Student]
      summary: 网页提交答案；服务端评分、快照、同意审计和幂等保存
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submissionId, assessmentId, answers, questionnaireVersion, scoringVersion, consent, consentVersion]
              properties:
                submissionId: { type: string, minLength: 6, maxLength: 128 }
                assessmentId: { type: integer, minimum: 1, maximum: 8 }
                taskId: { type: string }
                answers:
                  type: object
                  description: 零起始题号到零起始选项索引的映射
                  additionalProperties: { type: integer, minimum: 0, maximum: 3 }
                questionnaireVersion: { type: string }
                scoringVersion: { type: string }
                consent: { type: boolean, const: true }
                consentVersion: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/account:
    get:
      tags: [Authentication]
      summary: 获取本人账号与首次完善状态
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/account/profile:
    patch:
      tags: [Student]
      summary: 学生填写姓名并同意信息用途（不允许修改班级和学号）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, consent]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 50 }
                consent: { type: boolean, const: true }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/account/password:
    post:
      tags: [Authentication]
      summary: 验证原密码并修改密码，撤销现有会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 64 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/admin/students/{studentId}/reset-password:
    post:
      tags: [Admin]
      summary: 重置为学号后4位并撤销旧会话
      parameters:
        - in: path
          name: studentId
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /health:
    get:
      tags: [Operations]
      summary: 进程存活检查
      security: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /ready:
    get:
      tags: [Operations]
      summary: 服务与数据库就绪检查
      security: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus 指标
      description: 配置 METRICS_TOKEN 后使用独立 Bearer 令牌，不使用用户登录令牌。
      security: [{ metricsBearer: [] }]
      responses:
        "200":
          description: Prometheus 文本格式
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: 三类角色登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: 撤销当前服务端会话
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/semesters/current:
    get:
      tags: [Student]
      summary: 查询当前学期
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/assessment-tasks:
    get:
      tags: [Student]
      summary: 查询当前学生班级的测评任务
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/assessment-results:
    post:
      tags: [Student]
      summary: 幂等提交测评结果并由服务器复算
      description: submissionId 全局唯一；服务器忽略客户端身份并重新评分。原始答案以 AES-256-GCM 加密存储。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentSubmission" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/assessment-results/me:
    get:
      tags: [Student]
      summary: 查询当前学生结果摘要
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/content-items:
    get:
      tags: [Student]
      summary: 查询已发布的科普或课程思政内容
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [civics, psychoeducation] }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/counselor/classes:
    get:
      tags: [Counselor]
      summary: 查询辅导员当前学期授权班级
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/counselor/classes/{classId}/summary:
    get:
      tags: [Counselor]
      summary: 查询授权班级的必要摘要
      parameters:
        - $ref: "#/components/parameters/ClassId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/counselor/risk-events:
    get:
      tags: [Counselor]
      summary: 查询授权范围内风险事件
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [待确认, 跟进中, 已关闭] }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/counselor/risk-events/{eventId}:
    patch:
      tags: [Counselor]
      summary: 更新风险跟进状态和记录
      description: 跟进记录以 AES-256-GCM 加密存储。
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [待确认, 跟进中, 已关闭] }
                followupNote: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/counselor/students/{studentId}/summary:
    get:
      tags: [Counselor]
      summary: 查询授权学生支持摘要
      description: 不返回原始答题快照。
      parameters:
        - in: path
          name: studentId
          required: true
          schema: { type: string, maxLength: 80 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/counselor/content-items:
    post:
      tags: [Counselor]
      summary: 提交课程思政或心理科普内容审核
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentSubmission" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/counselor/content-items/mine:
    get:
      tags: [Counselor]
      summary: 查询当前辅导员的投稿和审核状态
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/counselor/media:
    post:
      tags: [Counselor]
      summary: 上传文章图片或视频
      description: 使用原始二进制请求体，X-File-Name 传递 URI 编码后的文件名。上传后须在 ContentSubmission.mediaIds 中引用。
      parameters:
        - in: header
          name: X-File-Name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          video/mp4: { schema: { type: string, format: binary } }
          video/webm: { schema: { type: string, format: binary } }
          video/quicktime: { schema: { type: string, format: binary } }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: 文件超过上限 }
        "415": { description: 媒体类型不支持 }
  /api/v1/admin/assessment-tasks:
    get:
      tags: [Admin]
      summary: 查询全部测评任务
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: 创建绑定固定评分版本的测评任务草稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, assessmentId, semesterId, deadline]
              properties:
                id: { type: string, maxLength: 128 }
                title: { type: string, maxLength: 100 }
                assessmentId: { type: integer, minimum: 1, maximum: 8 }
                semesterId: { type: string }
                deadline: { type: string, format: date }
                targetClassId: { type: string }
                questionnaireVersion: { type: string }
                scoringVersion: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/admin/assessment-tasks/{taskId}/status:
    patch:
      tags: [Admin]
      summary: 按受控状态机发布或结束任务
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [未开始, 进行中, 已结束] }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/content-items:
    get:
      tags: [Admin]
      summary: 按类型和状态查询待审核内容
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [civics, psychoeducation] }
        - in: query
          name: status
          schema: { type: string, enum: [待审核, 已发布, 已退回] }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/content-items/{contentId}/review:
    patch:
      tags: [Admin]
      summary: 发布或退回辅导员投稿
      parameters:
        - in: path
          name: contentId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [已发布, 已退回] }
                reviewNote: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/admin/audit-logs:
    get:
      tags: [Admin]
      summary: 查询最近结构化业务审计记录
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/semesters:
    get:
      tags: [Admin]
      summary: 查询全部学期
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: 创建学期
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SemesterInput" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/admin/semesters/{semesterId}/current:
    patch:
      tags: [Admin]
      summary: 原子切换当前学期并保留历史数据
      parameters:
        - $ref: "#/components/parameters/SemesterId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/counselor-assignments:
    get:
      tags: [Admin]
      summary: 查询辅导员班级分配
      parameters:
        - in: query
          name: semesterId
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [Admin]
      summary: 按学期分配辅导员班级权限，并替代该班原负责人
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId, classId, semesterId]
              properties:
                staffId: { type: string }
                classId: { type: string }
                semesterId: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [Admin]
      summary: 撤销指定学期的辅导员班级分配
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffId, classId, semesterId]
              properties:
                staffId: { type: string }
                classId: { type: string }
                semesterId: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/counselors:
    get:
      tags: [Admin]
      summary: 查询辅导员账号和有效班级数
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [Admin]
      summary: 由管理员创建辅导员账号，临时密码为123456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [staffId]
              properties:
                staffId: { type: string, minLength: 2, maxLength: 32 }
                displayName: { type: string, minLength: 1, maxLength: 50 }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/admin/counselors/{staffId}/reset-password:
    post:
      tags: [Admin]
      summary: 将辅导员密码重置为123456并撤销旧会话
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/counselors/{staffId}/status:
    patch:
      tags: [Admin]
      summary: 启用或停用辅导员账号
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/classes:
    get:
      tags: [Admin]
      summary: 按学期查询班级、学生数和当前负责辅导员
      parameters:
        - in: query
          name: semesterId
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/admin/students:
    get:
      tags: [Admin]
      summary: 查询学生基础信息
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/admin/import-batches:
    get:
      tags: [Admin]
      summary: 查询最近人员导入批次
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/admin/import-batches/preview:
    post:
      tags: [Admin]
      summary: 预检人员 CSV 并生成差异计划
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientBatchId, fileName, csvText]
              properties:
                clientBatchId: { type: string, minLength: 6, maxLength: 128 }
                fileName: { type: string, maxLength: 255 }
                csvText: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/admin/import-batches/{batchId}:
    get:
      tags: [Admin]
      summary: 查询单个导入批次
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/import-batches/{batchId}/confirm:
    post:
      tags: [Admin]
      summary: 单事务确认人员导入
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/import-batches/{batchId}/rollback:
    post:
      tags: [Admin]
      summary: 根据变更快照整批回滚
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/counselor/profile:
    get:
      tags: [Counselor]
      summary: 辅导员读取本人姓名、学院和联系方式
      responses:
        "200": { $ref: "#/components/responses/Success" }
    patch:
      tags: [Counselor]
      summary: 辅导员自行维护个人资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 50 }
                college: { type: string, maxLength: 100 }
                contact: { type: string, maxLength: 100 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/registry/students:
    get:
      tags: [Registry]
      summary: 查询授权范围内的学生档案，返回完整月度等级历史
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: college, schema: { type: string } }
        - { in: query, name: counselorId, schema: { type: string }, description: 管理员使用；辅导员始终限定本人 }
        - { in: query, name: month, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { in: query, name: level, schema: { type: string }, description: 按所选月份等级筛选 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [Registry]
      summary: 新增学生登记，管理员需指定负责辅导员
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistryStudentInput" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/registry/students/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Registry]
      summary: 读取一条学生档案；无权访问时返回404
      responses:
        "200": { $ref: "#/components/responses/Success" }
    patch:
      tags: [Registry]
      summary: 编辑完整档案，需携带读取时的revision及完整levels；不改变负责归属
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistryStudentInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/registry/template:
    get:
      tags: [Registry]
      summary: 下载xlsx登记模板，原表12列后附可选学号列
      parameters:
        - { in: query, name: month, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        "200":
          description: XLSX文件
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /api/v1/registry/export:
    post:
      tags: [Registry]
      summary: 按查询或选中ID导出指定月份Excel，记录导出审计
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistryExportFilters" }
      responses:
        "200":
          description: XLSX文件
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /api/v1/registry/print:
    post:
      tags: [Registry]
      summary: 获取打印所需的授权档案并记录审计；浏览器负责打印及保存PDF
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistryExportFilters" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/registry/import/preview:
    post:
      tags: [Registry]
      summary: 预检xlsx，返回完整字段、原行号、错误与重名提示；不创建学生档案
      parameters:
        - { in: query, name: month, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { in: query, name: counselorId, schema: { type: string }, description: 管理员需指定已启用的辅导员 }
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary, description: 最大5MB、2000条、100列 }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/registry/import/{id}/confirm:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Registry]
      summary: 上传本人在15分钟内确认导入；重复确认返回相同结果
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledgeDuplicates: { type: boolean, description: 已核对重名提示并确认需要分别建档 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { description: 预览已过期，请重新上传 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/talk-records/options:
    get:
      tags: [TalkRecords]
      summary: 返回原表困扰选项、签名方式及文档字体条件
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/talk-records:
    get:
      tags: [TalkRecords]
      summary: 本人记录列表或管理员全校查询，不返回谈话正文
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: counselorId, schema: { type: string }, description: 管理员可指定辅导员 }
        - { in: query, name: registryStudentId, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [TalkRecords]
      summary: 辅导员独立保存一次谈话，允许未完成内容；管理员不可代写
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TalkRecordInput" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/talk-records/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [TalkRecords]
      summary: 获取完整谈话表及系统保存修改时间，无权时返回404
      responses:
        "200": { $ref: "#/components/responses/Success" }
    patch:
      tags: [TalkRecords]
      summary: 所属辅导员修改，必须携带revision；管理员只读
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TalkRecordInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/talk-records/{id}/document:
    get:
      tags: [TalkRecords]
      summary: 生成学校原表Word/PDF，检查页数和边线，不截断文字或改变字号
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: format, schema: { type: string, enum: [doc, docx, pdf], default: pdf } }
        - { in: query, name: revision, schema: { type: integer, minimum: 1 } }
        - { in: query, name: preview, schema: { type: string, enum: ['1'] }, description: inline预览，否则附件下载 }
        - { in: query, name: purpose, schema: { type: string, enum: [print] }, description: 记录打印审计 }
      responses:
        "200":
          description: 原表格式文件
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/msword:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: 文档转换器不可用或超时 }
components:
  securitySchemes:
    campusCookie:
      type: apiKey
      in: cookie
      name: campus_session
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    metricsBearer: { type: http, scheme: bearer }
  parameters:
    ClassId:
      in: path
      name: classId
      required: true
      schema: { type: string, maxLength: 64 }
    SemesterId:
      in: path
      name: semesterId
      required: true
      schema: { type: string, maxLength: 64 }
    StaffId:
      in: path
      name: staffId
      required: true
      schema: { type: string, minLength: 2, maxLength: 32 }
    BatchId:
      in: path
      name: batchId
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    TalkRecordInput:
      type: object
      required: [name, issues]
      properties:
        clientRequestId: { type: string, minLength: 8, maxLength: 80, description: 新建必填，同请求重试不重复保存 }
        revision: { type: integer, minimum: 1, description: 修改时必填 }
        registryStudentId: { type: string, description: 可关联本人学生档案，修改不更换关联 }
        name: { type: string, minLength: 1, maxLength: 50 }
        gender: { type: string, maxLength: 10 }
        college: { type: string, maxLength: 100 }
        gradeClass: { type: string, maxLength: 200 }
        studentNo: { type: string, maxLength: 50 }
        talkDate: { type: string, description: YYYY-MM-DD或未完成时为空 }
        issues:
          type: array
          items: { type: integer, minimum: 1, maximum: 9 }
          description: 原表九类困扰，多选；预览和导出仅显示选中项，保留原编号
        otherIssue: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 10000, description: 保存允许长记录，导出需符合原表容量 }
    RegistryExportFilters:
      type: object
      required: [month]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        q: { type: string }
        college: { type: string }
        counselorId: { type: string }
        level: { type: string }
        ids: { type: string, description: 逗号分隔的档案ID，最多2000条；仍需符合查询范围和权限 }
    RegistryStudentInput:
      type: object
      required: [college, name, gradeMajor]
      properties:
        counselorId: { type: string, description: 管理员新增时必填；辅导员自动归属本人 }
        revision: { type: integer, minimum: 1, description: 修改时必填，旧版本拒绝覆盖 }
        acknowledgeDuplicate: { type: boolean }
        college: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 50 }
        gender: { type: string, maxLength: 10 }
        gradeMajor: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, maxLength: 100 }
        dorm: { type: string, maxLength: 100 }
        studentNo: { type: string, maxLength: 50 }
        counselorInfo: { type: string, maxLength: 200 }
        studentSupport: { type: string, maxLength: 1000 }
        leaderSupport: { type: string, maxLength: 1000 }
        remarks: { type: string, maxLength: 3000 }
        levels:
          type: object
          maxProperties: 240
          description: YYYY-MM到等级文本的映射，修改时传完整历史
          additionalProperties: { type: string, maxLength: 40 }
    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, const: true }
        data: {}
    ErrorEnvelope:
      type: object
      required: [ok, error, requestId]
      properties:
        ok: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
        requestId: { type: string, format: uuid }
    LoginRequest:
      type: object
      required: [role, accountId, password]
      properties:
        client: { type: string, enum: [web], description: 网页登录只设置Cookie而不返回token }
        role: { type: string, enum: [counselor, admin] }
        accountId: { type: string, maxLength: 160 }
        password: { type: string, format: password }
    LoginResult:
      type: object
      required: [expiresIn, user]
      properties:
        token: { type: string, writeOnly: true }
        expiresIn: { type: integer }
        user:
          type: object
          properties:
            id: { type: string }
            role: { type: string, enum: [counselor, admin] }
            accountId: { type: string }
            displayName: { type: string }
            studentId: { type: string }
            staffId: { type: string }
            classId: { type: string }
    SemesterInput:
      type: object
      required: [name, startDate, endDate]
      properties:
        id: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 160 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    AssessmentSubmission:
      type: object
      required: [submissionId, assessmentId, score, total, normalizedRiskScore, stdScore, riskLevel, questionnaireVersion, scoringVersion, questionnaireSnapshot, answerSnapshot]
      properties:
        submissionId: { type: string, minLength: 6, maxLength: 128 }
        taskId: { type: string }
        assessmentId: { type: integer, minimum: 1, maximum: 8 }
        assessmentName: { type: string, maxLength: 100 }
        score: { type: number }
        total: { type: number }
        normalizedRiskScore: { type: number, minimum: 0, maximum: 100 }
        stdScore: { type: number, minimum: 0, maximum: 100 }
        riskLevel: { type: string, enum: [正常, 关注, 较高风险, 紧急风险] }
        questionnaireVersion: { type: string }
        scoringVersion: { type: string }
        questionnaireSnapshot: {}
        answerSnapshot:
          type: array
          items:
            type: object
            required: [questionId, selectedIndex]
            properties:
              questionId: { type: integer }
              selectedIndex: { type: integer, minimum: 0, maximum: 3 }
        createdAt: { type: string, format: date-time }
    ContentSubmission:
      type: object
      required: [type, title, content]
      properties:
        type: { type: string, enum: [civics, psychoeducation] }
        title: { type: string, maxLength: 160 }
        category: { type: string, maxLength: 80 }
        summary: { type: string, maxLength: 500 }
        content: { type: string, maxLength: 20000 }
        mediaIds:
          type: array
          maxItems: 9
          uniqueItems: true
          items: { type: string, format: uuid }
  responses:
    Success:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessEnvelope" }
    BadRequest:
      description: 请求格式错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: 未登录、令牌失效或监控令牌错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: 角色或数据范围越权
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: 当前状态不允许操作或幂等编号冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationError:
      description: 业务字段或评分版本校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: 请求超过限额，响应包含 Retry-After
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
security:
  - bearerAuth: []
  - campusCookie: []
