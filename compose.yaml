name: shuzhi-heart-harbor

services:
  backend:
    image: shuzhi-backend:sqlite
    build:
      context: .
      dockerfile: server/Dockerfile
    init: true
    ports:
      - "${BACKEND_PORT:-8787}:8787"
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      HOST: "0.0.0.0"
      PORT: "8787"
      DATABASE_ENGINE: "sqlite"
      DATABASE_PATH: "/app/data/app.db"
      UPLOAD_DIRECTORY: "/app/data/uploads"
      MAX_MEDIA_BYTES: "104857600"
      MEDIA_UPLOAD_TIMEOUT_MS: "300000"
      AUTH_SECRET: "${AUTH_SECRET:?请先复制 .env.compose.example 为 .env 并设置 AUTH_SECRET}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-}"
      DATA_ENCRYPTION_KEY_ID: "${DATA_ENCRYPTION_KEY_ID:-primary}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      GENERAL_RATE_LIMIT_PER_MINUTE: "${GENERAL_RATE_LIMIT_PER_MINUTE:-300}"
      LOGIN_RATE_LIMIT_PER_MINUTE: "${LOGIN_RATE_LIMIT_PER_MINUTE:-30}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
    volumes:
      - backend-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backend-mysql:
    image: shuzhi-backend:mysql
    profiles: ["mysql-runtime"]
    build:
      context: .
      dockerfile: server/Dockerfile
    init: true
    ports:
      - "${BACKEND_PORT:-8787}:8787"
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      HOST: "0.0.0.0"
      PORT: "8787"
      DATABASE_ENGINE: "mysql"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-shuzhi}"
      MYSQL_USER: "${MYSQL_USER:-shuzhi_app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-local-mysql-password-change-me}"
      MYSQL_SSL_CA: "${MYSQL_SSL_CA:-}"
      MYSQL_CONNECTION_LIMIT: "${MYSQL_CONNECTION_LIMIT:-20}"
      MYSQL_IDLE_TIMEOUT_MS: "${MYSQL_IDLE_TIMEOUT_MS:-60000}"
      MYSQL_QUEUE_LIMIT: "${MYSQL_QUEUE_LIMIT:-1000}"
      UPLOAD_DIRECTORY: "/app/data/uploads"
      MAX_MEDIA_BYTES: "104857600"
      MEDIA_UPLOAD_TIMEOUT_MS: "300000"
      AUTH_SECRET: "${AUTH_SECRET:?请先复制 .env.compose.example 为 .env 并设置 AUTH_SECRET}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-}"
      DATA_ENCRYPTION_KEY_ID: "${DATA_ENCRYPTION_KEY_ID:-primary}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      GENERAL_RATE_LIMIT_PER_MINUTE: "${GENERAL_RATE_LIMIT_PER_MINUTE:-300}"
      LOGIN_RATE_LIMIT_PER_MINUTE: "${LOGIN_RATE_LIMIT_PER_MINUTE:-30}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - media-uploads:/app/data/uploads
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      mysql-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  mysql:
    image: mysql:8.4
    profiles: ["mysql", "mysql-runtime"]
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-shuzhi}"
      MYSQL_USER: "${MYSQL_USER:-shuzhi_app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-local-mysql-password-change-me}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-local-mysql-root-password-change-me}"
      TZ: "Asia/Shanghai"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s

  mysql-migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: migration
    profiles: ["mysql", "mysql-runtime"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-shuzhi}"
      MYSQL_USER: "${MYSQL_USER:-shuzhi_app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-local-mysql-password-change-me}"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "node scripts/mysql-migrate.js && node scripts/mysql-schema-smoke.js"]
    restart: "no"

volumes:
  backend-data:
  mysql-data:
  media-uploads:
